name: CI - Build and Test

on:
  pull_request:
    branches: [ "jdbc" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Build and Test with Gradle
      env:
        DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
        DATASOURCES_DEFAULT_USERNAME: root
        DATASOURCES_DEFAULT_PASSWORD: password
        FLYWAY_DATASOURCES_DEFAULT_ENABLED: true
      run: ./gradlew build
